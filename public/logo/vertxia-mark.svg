<!--
  Vertxia logo mark — isometric 3D vertex.

  Concept : "Vertxia" contient "vertex" (= point où 3 axes 3D se rencontrent).
  Le mark représente les 3 axes (X, Y, Z) convergeant vers une origine,
  vus en perspective isométrique — l'angle d'un cube wireframe.

  Couleur primaire : --color-accent (#A16207 gold).
  Format : SVG scalable, optimisé pour favicon 16px → OG image 1200px.

  Pour le wordmark complet "VERTXIA" + symbole, voir vertxia-lockup.svg.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="64"
  height="64"
  fill="none"
  stroke="currentColor"
  stroke-width="3"
  stroke-linecap="round"
  stroke-linejoin="round"
  role="img"
  aria-label="Vertxia"
>
  <!-- Y axis (vertical up) -->
  <line x1="32" y1="32" x2="32" y2="7" />
  <!-- X axis (down-right isometric, 30° below horizontal) -->
  <line x1="32" y1="32" x2="55" y2="45.5" />
  <!-- Z axis (down-left isometric, mirror of X) -->
  <line x1="32" y1="32" x2="9" y2="45.5" />
  <!-- Vertex point (origin) -->
  <circle cx="32" cy="32" r="3.2" fill="currentColor" stroke="none" />
</svg>
