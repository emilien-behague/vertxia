<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Favicon Vertxia SVG : fond noir + 3 branches gold a 120°.
       Sert directement aux navigateurs modernes (Chrome, Firefox, Safari)
       et a Google qui supporte les favicons SVG depuis 2023. -->
  <rect width="100" height="100" fill="#111111"/>
  <g stroke="#A16207" stroke-width="11" stroke-linecap="round">
    <line x1="50" y1="50" x2="50" y2="14"/>
    <line x1="50" y1="50" x2="81.2" y2="68"/>
    <line x1="50" y1="50" x2="18.8" y2="68"/>
  </g>
</svg>
